<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흑월 | Black Moon</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f6fa;color:#182033}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;font-weight:bold}
input,select{width:100%;padding:11px;border:1px solid #dce0e8;border-radius:8px;background:white}
.layout{min-height:100vh;display:grid;grid-template-columns:230px 1fr}
aside{background:#100d10;color:white;padding:20px 12px;display:flex;flex-direction:column;gap:20px}
.brand{font-size:21px;font-weight:bold;padding:8px;border-bottom:1px solid #393136;padding-bottom:20px}
.brand small{display:block;font-size:11px;color:#c6a4a4;margin-top:7px}
nav{display:grid;gap:6px}
nav button{text-align:left;background:transparent;color:#ddd}
nav button.active,nav button:hover{background:#801b22;color:white}
.user{margin-top:auto;padding:12px;background:#ffffff12;border-radius:10px;font-size:12px}
main{min-width:0}
header{background:white;padding:16px 24px;border-bottom:1px solid #e4e6ed;display:flex;justify-content:space-between;align-items:center;gap:12px}
.content{padding:22px;max-width:1250px;margin:auto}
.hero{padding:28px;border-radius:14px;background:linear-gradient(110deg,#1d4ed8,#5b35d5);color:white}
.hero h1{margin:12px 0;font-size:27px}
.hero p{line-height:1.7;color:#e6eaff}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.card,.panel{background:white;border:1px solid #e5e7eb;border-radius:13px;padding:19px;margin-bottom:16px}
.card span{color:#718096;font-size:13px}
.card strong{display:block;font-size:24px;margin:20px 0 8px}
.card small,.muted{color:#718096;font-size:12px}
.panel h2{font-size:16px;margin:0 0 15px}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:grid;gap:6px;font-size:12px;font-weight:bold}
.full{grid-column:1/-1}
.primary{background:#244cf4;color:white}
.secondary{background:white;border:1px solid #d9deea;color:#27334a}
.danger{background:#fff0f0;color:#a21b27}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e7e9ef}
th{color:#647084}
.table-wrap{overflow-x:auto}
.empty{padding:24px;text-align:center;color:#788397;font-size:13px}
.toast{display:none;background:#e8fff4;color:#087550;padding:12px;border-radius:9px;margin-bottom:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}
.modal-box{background:white;padding:24px;border-radius:15px;width:min(400px,100%)}
.modal-box .field{margin:12px 0}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{padding:12px}.brand{padding-bottom:10px}nav{grid-template-columns:repeat(2,1fr)}.user{display:none}.cards{grid-template-columns:1fr}.content{padding:12px}.form{grid-template-columns:1fr 1fr}header{padding:12px;flex-wrap:wrap}}
@media(max-width:480px){.form{grid-template-columns:1fr}.full{grid-column:auto}.hero{padding:20px}}
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand">☾ 흑월 <span style="color:#e6c86e">Black Moon</span><small>조직 통합 관리 패널</small></div>
  <nav>
    <button class="active" data-page="dashboard">▦ 대시보드</button>
    <button data-page="members">♙ 조직원 관리</button>
    <button data-page="ranks">☷ 직급표</button>
    <button data-page="ledger">▤ 장부 관리</button>
    <button data-page="items">▣ 품목 관리</button>
    <button data-page="history">◉ 거래내역 조회</button>
    <button data-page="loans">▱ 대출 관리</button>
  </nav>
  <div class="user"><b id="usernameDisplay">방문자</b><br><span id="roleDisplay">로그인 전</span></div>
</aside>

<main>
<header>
  <b id="pageTitle">대시보드</b>
  <div class="actions">
    <button class="secondary" id="loginButton">로그인</button>
    <button class="primary" id="quickButton">＋ 장부 작성</button>
  </div>
</header>
<div class="content">
  <div class="toast" id="toast"></div>
  <div id="view"></div>
</div>
</main>
</div>

<div class="modal" id="loginModal">
  <div class="modal-box">
    <h2>조직원 로그인</h2>
    <form id="loginForm">
      <div class="field">아이디<input name="username" required autocomplete="username"></div>
      <div class="field">비밀번호<input name="password" type="password" required autocomplete="current-password"></div>
      <div class="actions">
        <button type="button" class="secondary" onclick="closeLogin()">취소</button>
        <button class="primary">로그인</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="staffModal">
  <div class="modal-box">
    <h2>로그인 계정 생성</h2>
    <form id="staffForm">
      <div class="field">아이디<input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]+"></div>
      <div class="field">비밀번호<input name="password" type="password" required minlength="8"></div>
      <div class="actions">
        <button type="button" class="secondary" onclick="closeStaff()">취소</button>
        <button class="primary">계정 생성</button>
      </div>
    </form>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const state = {user:null, role:null, page:"dashboard"};
const titles = {
  dashboard:"대시보드", members:"조직원 관리", ranks:"직급표",
  ledger:"장부 관리", items:"품목 관리",
  history:"거래내역 조회", loans:"대출 관리"
};

async function api(url, options={}) {
  const response = await fetch(url, {
    credentials:"same-origin",
    headers:{"Content-Type":"application/json"},
    ...options
  });
  const data = await response.json().catch(()=>({error:"서버 응답 오류"}));
  if (!response.ok) throw new Error(data.error || "요청 실패");
  return data;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

function won(value) {
  return Number(value || 0).toLocaleString("ko-KR") + "원";
}

function notify(message) {
  $("toast").textContent = message;
  $("toast").style.display = "block";
  setTimeout(()=>$("toast").style.display="none",3500);
}

function isAdmin() { return state.role === "admin"; }

function setUser(data) {
  state.user = data?.user?.username || null;
  state.role = data?.user?.role || null;
  $("usernameDisplay").textContent = state.user || "방문자";
  $("roleDisplay").textContent = !state.user ? "로그인 전" :
    (isAdmin() ? "관리자" : "조직원");
  $("loginButton").textContent = state.user ? "로그아웃" : "로그인";
}

function requireLogin() {
  if (state.user) return true;
  $("loginModal").style.display = "flex";
  return false;
}

function table(headers, rows) {
  if (!rows.length) return '<div class="empty">등록된 내역이 없습니다.</div>';
  return `<div class="table-wrap"><table>
    <thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead>
    <tbody>${rows.join("")}</tbody>
  </table></div>`;
}

function row(values) {
  return "<tr>" + values.map(v=>`<td>${v}</td>`).join("") + "</tr>";
}

function render(title, html) {
  $("pageTitle").textContent = title;
  $("view").innerHTML = html;
}

function dashboardHTML() {
  return `
  <section class="hero">
    <div>● 흑월 조직 관리 포털</div>
    <h1>흑월 공동 업무 포털</h1>
    <p>조직원, 직급, 수입·지출, 품목 및 대출 내역을 관리합니다.</p>
    <div class="actions">
      <button class="secondary" onclick="go('ledger')">장부 관리</button>
      <button class="secondary" onclick="go('members')">조직원 관리</button>
    </div>
  </section>
  <div class="cards">
    <div class="card"><span>총 조직원</span><strong id="memberCount">0명</strong><small>등록된 조직원</small></div>
    <div class="card"><span>누적 총수입</span><strong id="income">0원</strong><small>장부 수입 합계</small></div>
    <div class="card"><span>순자산</span><strong id="net">0원</strong><small id="expense">총 지출: 0원</small></div>
  </div>
  <section class="panel">
    <h2>최근 거래내역</h2>
    <div id="recent"><div class="empty">불러오는 중...</div></div>
  </section>`;
}

async function loadDashboard() {
  try {
    const stats = await api("/api/dashboard");
    const result = await api("/api/ledger");
    $("memberCount").textContent = (stats.members || 0) + "명";
    $("income").textContent = won(stats.income);
    $("net").textContent = won(stats.net);
    $("expense").textContent = "총 지출: " + won(stats.expense);

    const entries = result.ledger || [];
    $("recent").innerHTML = table(
      ["일자","구분","항목","금액","작성자"],
      entries.slice(0,8).map(x=>row([
        esc(String(x.created_at).slice(0,10)),
        esc(x.type), esc(x.description),
        (x.type==="수입"?"+":"−")+won(x.amount),
        esc(x.created_by)
      ]))
    );
  } catch (error) {
    $("recent").innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  }
}

async function removeRecord(url) {
  if (!confirm("정말 삭제할까요?")) return;
  try {
    await api(url,{method:"DELETE"});
    notify("삭제했습니다.");
    await loadPage();
  } catch(e) { notify(e.message); }
}

async function loadPage() {
  if (state.page === "dashboard") {
    render(titles.dashboard,dashboardHTML());
    if (state.user) await loadDashboard();
    return;
  }
  if (!requireLogin()) return;

  try {
    if (state.page === "ledger" || state.page === "history") {
      return await loadLedger(state.page === "history");
    }
    if (state.page === "members") return await loadMembers();
    if (state.page === "ranks") return await loadRanks();
    if (state.page === "items") return await loadItems();
    if (state.page === "loans") return await loadLoans();
  } catch(e) {
    render(titles[state.page],`<section class="panel">
      <h2>화면을 불러오지 못했습니다.</h2>
      <p>${esc(e.message)}</p>
      <button class="secondary" onclick="loadPage()">다시 시도</button>
    </section>`);
  }
}

async function loadLedger(history) {
  const data = await api(history ? "/api/transactions" : "/api/ledger");
  const entries = data.transactions || data.ledger || [];

  render(titles[state.page],`
    ${history ? "" : `<section class="panel">
      <h2>수입·지출 등록</h2>
      <form id="ledgerForm" class="form">
        <label class="field">구분
          <select name="type"><option>수입</option><option>지출</option></select>
        </label>
        <label class="field">항목명<input name="description" required maxlength="200"></label>
        <label class="field">금액(원)<input name="amount" type="number" min="1" required></label>
        <div class="full"><button class="primary">장부 저장</button></div>
      </form>
    </section>`}
    <section class="panel">
      <h2>${history?"전체 거래내역":"장부 내역"}</h2>
      ${table(["일자","구분","항목","금액","작성자"],entries.map(x=>row([
        esc(String(x.created_at).slice(0,10)),esc(x.type),
        esc(x.description),(x.type==="수입"?"+":"−")+won(x.amount),
        esc(x.created_by)
      ])))}
    </section>`);

  if (!history) $("ledgerForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      await api("/api/ledger",{method:"POST",body:JSON.stringify({
        type:f.get("type"),description:f.get("description"),
        amount:Number(f.get("amount"))
      })});
      notify("장부가 저장되었습니다.");
      await loadPage();
    } catch(x) { notify(x.message); }
  };
}

async function loadMembers() {
  const data = await api("/api/members");
  const members = data.members || [];

  render(titles.members,`
    ${isAdmin()?`<section class="panel">
      <h2>조직원 명단 등록</h2>
      <form id="memberForm" class="form">
        <label class="field">IC 성명<input name="name" required></label>
        <label class="field">직급<input name="rank" value="조직원"></label>
        <label class="field">메모<input name="note"></label>
        <div class="full actions">
          <button class="primary">조직원 등록</button>
          <button type="button" class="secondary" onclick="openStaff()">로그인 계정 생성</button>
        </div>
      </form>
    </section>`:""}
    <section class="panel"><h2>조직원 명단 (${members.length}명)</h2>
      ${table(["IC 성명","직급","메모",...(isAdmin()?["관리"]:[])],
        members.map(x=>row([
          esc(x.name),esc(x.rank),esc(x.note),
          ...(isAdmin()?[`<button class="danger" onclick="removeRecord('/api/members/${x.id}')">삭제</button>`]:[])
        ])))}
    </section>`);

  if (isAdmin()) $("memberForm").onsubmit = async e => {
    e.preventDefault(); const f=new FormData(e.target);
    try {
      await api("/api/members",{method:"POST",body:JSON.stringify({
        name:f.get("name"),rank:f.get("rank"),note:f.get("note")
      })});
      notify("조직원을 등록했습니다."); await loadPage();
    } catch(x) { notify(x.message); }
  };
}

async function loadRanks() {
  const data=await api("/api/ranks"), ranks=data.ranks||[];
  render(titles.ranks,`
    ${isAdmin()?`<section class="panel"><h2>직급 추가</h2>
      <form id="rankForm" class="form">
        <label class="field">직급명<input name="name" required></label>
        <label class="field">순서<input name="level" type="number" min="0" value="0"></label>
        <div><button class="primary">직급 추가</button></div>
      </form>
    </section>`:""}
    <section class="panel"><h2>직급 목록</h2>
      ${table(["직급","순서",...(isAdmin()?["관리"]:[])],ranks.map(x=>row([
        esc(x.name),esc(x.level),
        ...(isAdmin()?[`<button class="danger" onclick="removeRecord('/api/ranks/${x.id}')">삭제</button>`]:[])
      ])))}
    </section>`);

  if(isAdmin()) $("rankForm").onsubmit=async e=>{
    e.preventDefault();const f=new FormData(e.target);
    try{
      await api("/api/ranks",{method:"POST",body:JSON.stringify({
        name:f.get("name"),level:Number(f.get("level")||0)
      })});
      notify("직급을 추가했습니다.");await loadPage();
    }catch(x){notify(x.message);}
  };
}

async function loadItems() {
  const data=await api("/api/items"),items=data.items||[];
  render(titles.items,`
    ${isAdmin()?`<section class="panel"><h2>품목 등록</h2>
      <form id="itemForm" class="form">
        <label class="field">품목명<input name="name" required></label>
        <label class="field">기준 가격<input name="price" type="number" min="0" value="0"></label>
        <label class="field">설명<input name="description"></label>
        <div class="full"><button class="primary">품목 추가</button></div>
      </form>
    </section>`:""}
    <section class="panel"><h2>품목 목록</h2>
      ${table(["품목","기준 가격","설명",...(isAdmin()?["관리"]:[])],items.map(x=>row([
        esc(x.name),won(x.price),esc(x.description),
        ...(isAdmin()?[`<button class="danger" onclick="removeRecord('/api/items/${x.id}')">삭제</button>`]:[])
      ])))}
    </section>`);

  if(isAdmin()) $("itemForm").onsubmit=async e=>{
    e.preventDefault();const f=new FormData(e.target);
    try{
      await api("/api/items",{method:"POST",body:JSON.stringify({
        name:f.get("name"),price:Number(f.get("price")||0),
        description:f.get("description")
      })});
      notify("품목을 추가했습니다.");await loadPage();
    }catch(x){notify(x.message);}
  };
}

async function loadLoans() {
  const data=await api("/api/loans"),loans=data.loans||[];
  render(titles.loans,`
    ${isAdmin()?`<section class="panel"><h2>대출 지급</h2>
      <p class="muted">대출 지급은 장부 지출로, 상환은 장부 수입으로 자동 등록됩니다.</p>
      <form id="loanForm" class="form">
        <label class="field">대출자<input name="borrower" required></label>
        <label class="field">금액(원)<input name="amount" type="number" min="1" required></label>
        <label class="field">사유<input name="description"></label>
        <div class="full"><button class="primary">대출 지급 등록</button></div>
      </form>
    </section>`:""}
    <section class="panel"><h2>대출 내역</h2>
      ${table(["대출자","대출금","상환액","잔액","상태",...(isAdmin()?["상환"]:[])],loans.map(x=>row([
        esc(x.borrower),won(x.amount),won(x.repaid),won(x.amount-x.repaid),
        esc(x.status),
        ...(isAdmin()?[`<button class="secondary" onclick="repayLoan(${x.id})">상환 등록</button>`]:[])
      ])))}
    </section>`);

  if(isAdmin()) $("loanForm").onsubmit=async e=>{
    e.preventDefault();const f=new FormData(e.target);
    try{
      await api("/api/loans",{method:"POST",body:JSON.stringify({
        borrower:f.get("borrower"),amount:Number(f.get("amount")),
        description:f.get("description")
      })});
      notify("대출과 장부 지출을 등록했습니다.");await loadPage();
    }catch(x){notify(x.message);}
  };
}

async function repayLoan(id) {
  const amount=Number(prompt("상환 금액(원)을 입력하세요."));
  if(!Number.isSafeInteger(amount)||amount<=0)return;
  try{
    await api(`/api/loans/${id}/repay`,{
      method:"POST",body:JSON.stringify({amount})
    });
    notify("상환 및 장부 수입을 등록했습니다.");await loadPage();
  }catch(e){notify(e.message);}
}

function go(page) {
  state.page=page;
  document.querySelectorAll("[data-page]").forEach(b=>
    b.classList.toggle("active",b.dataset.page===page)
  );
  $("quickButton").textContent=page==="loans"?"대출 관리":"＋ 장부 작성";
  loadPage();
}

function openStaff() {
  if(!isAdmin())return notify("관리자만 사용할 수 있습니다.");
  $("staffModal").style.display="flex";
}
function closeLogin(){$("loginModal").style.display="none";}
function closeStaff(){$("staffModal").style.display="none";}

window.go=go;
window.removeRecord=removeRecord;
window.repayLoan=repayLoan;
window.openStaff=openStaff;
window.closeLogin=closeLogin;
window.closeStaff=closeStaff;

document.querySelectorAll("[data-page]").forEach(b=>{
  b.addEventListener("click",()=>go(b.dataset.page));
});

$("loginButton").onclick=async()=>{
  if(!state.user){$("loginModal").style.display="flex";return;}
  try{
    await api("/api/logout",{method:"POST",body:"{}"});
    setUser(null);notify("로그아웃했습니다.");go("dashboard");
  }catch(e){notify(e.message);}
};

$("quickButton").onclick=()=>{
  if(!requireLogin())return;
  if(state.page==="members"&&isAdmin())return openStaff();
  go(state.page==="loans"?"loans":"ledger");
};

$("loginForm").onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target);
  try{
    const data=await api("/api/login",{method:"POST",body:JSON.stringify({
      username:f.get("username"),password:f.get("password")
    })});
    setUser(data);closeLogin();notify("로그인되었습니다.");await loadPage();
  }catch(x){notify(x.message);}
};

$("staffForm").onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target);
  try{
    await api("/api/staff",{method:"POST",body:JSON.stringify({
      username:f.get("username"),password:f.get("password")
    })});
    closeStaff();e.target.reset();notify("조직원 계정을 생성했습니다.");
  }catch(x){notify(x.message);}
};

(async()=>{
  try{setUser(await api("/api/me"));}
  catch{setUser(null);}
  await loadPage();
})();
</script>
</body>
</html>
