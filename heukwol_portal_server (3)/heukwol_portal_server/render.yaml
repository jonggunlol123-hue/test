services:
  - type: web
    name: heukwol-organization-portal
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: heukwol-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_FILE
        value: /opt/render/project/src/data/heukwol.sqlite
